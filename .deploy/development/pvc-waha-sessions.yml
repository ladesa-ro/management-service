# PersistentVolumeClaim para sessões do WAHA (WhatsApp HTTP API).
#
# Aplicar antes do primeiro deploy do WAHA no cluster:
#   kubectl apply -f pvc-waha-sessions.yml -n ladesa-ro-development
#
# Motivo: o WAHA armazena as chaves de autenticação WhatsApp em /app/.sessions.
# Sem persistência (emptyDir), toda reinicialização/rollout desconecta a sessão
# e exige nova autenticação via QR code ou pairing code.
#
# AccessMode: ReadWriteOnce — suficiente pois o WAHA opera com 1 réplica.
# Para múltiplas réplicas (WAHA Plus) seria necessário ReadWriteMany.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ladesa-ro-waha-sessions-pvc
  namespace: ladesa-ro-development
  labels:
    app: ladesa-ro-waha
    component: session-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # Não especificamos storageClassName para usar o default do cluster.
  # Em clusters com múltiplas storage classes, especifique explicitamente:
  # storageClassName: standard
