<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ladesa - WhatsApp Connection</title>
  
  <!-- Modern Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  
  <script src="//code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.2.0/socket.io.js"
    integrity="sha512-WL6WGKMPBiM9PnHRYIn5YEtq0Z8XP4fkVb4qy7PP4vhmYQErJ/dySyXuFIMDf1eEYCXCrQrMJfkNwKc9gsjTjA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a, #1e293b, #0f172a);
      --glass-bg: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      background-size: 400% 400%;
      animation: gradientBg 15s ease infinite;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    @keyframes gradientBg {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
      animation: fadeInDown 0.8s ease;
    }

    header h1 {
      font-weight: 800;
      font-size: 2.5rem;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, #34d399, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    #wrap {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .session-card {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 0.6s ease forwards;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .session-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      padding-bottom: 1rem;
    }

    .info {
      font-size: 1.25rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-badge {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-weight: 600;
    }

    .eventwrap {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    @media (max-width: 768px) {
      .eventwrap {
        grid-template-columns: 1fr;
      }
    }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      padding: 1.5rem;
      min-height: 350px;
      position: relative;
    }

    .qr {
      width: 100%;
      max-width: 300px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .qr:hover {
      transform: scale(1.02);
    }

    .qr-placeholder {
      position: absolute;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      animation: pulse 2s infinite;
    }

    .log-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .log-title {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
    }

    .log {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 1rem;
      height: 350px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.85rem;
      line-height: 1.5;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .log::-webkit-scrollbar {
      width: 6px;
    }

    .log::-webkit-scrollbar-track {
      background: transparent;
    }

    .log::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
    }

    .log::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.4);
    }

    .log a {
      color: #60a5fa;
      text-decoration: none;
    }

    .log a:hover {
      text-decoration: underline;
    }

    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .loader {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      border-top-color: var(--accent);
      animation: spin 1s ease-in-out infinite;
      margin-right: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <header>
    <h1>Ladesa WhatsApp</h1>
    <p>Conecte seu dispositivo para ativar as integrações</p>
  </header>

  <div id="wrap">
    <!-- As sessões serão renderizadas aqui -->
  </div>

  <script>
    var Application = function () {
      var sessions = [];

      function c() {
        var n = $('.c').attr('id');
        var count = n;
        $('.c').text(count);
        setInterval(function () {
          count--;
          if (count >= 0) {
            $('.c').text(count);
          }
        }, 1000);
      }

      function appendLog(sessionId, text, isHtml = false) {
        const logEl = $(`#${sessionId} .log`);
        const currentHtml = logEl.html();
        const separator = currentHtml.trim() ? '<br>' : '';
        logEl.html(currentHtml + separator + (isHtml ? text : $('<div>').text(text).html()));
        
        // Auto scroll to bottom
        const domEl = logEl[0];
        domEl.scrollTop = domEl.scrollHeight;
      }

      function consume(message) {
        console.log('Received message:', message);
        
        if (!message.sessionId) return;

        // Criar template da sessão caso não exista
        if (!sessions.includes(message.sessionId)) {
          $('#wrap').append(`
            <div id="${message.sessionId}" class="session-card">
              <div class="session-header">
                <div class="info">
                  <div class="loader"></div>
                  <span>Sessão: ${message.sessionId}</span>
                </div>
                <div class="status-badge">Conectando...</div>
              </div>
              <div class="eventwrap">
                <div class="qr-container">
                  <div class="qr-placeholder">Aguardando QR Code...<br><small>Isso pode levar alguns segundos</small></div>
                  <img class="qr" style="display: none;" />
                </div>
                <div class="log-container">
                  <div class="log-title">Logs do Sistema</div>
                  <pre class="log"></pre>
                </div>
              </div>
            </div>
          `);
          sessions.push(message.sessionId);
        }

        // Lógica de atualização
        if (message.namespace === "qr") {
          $(`#${message.sessionId} .status-badge`).text('Aguardando Leitura');
          $(`#${message.sessionId} .qr-placeholder`).hide();
          
          let qrSrc = message.data;
          // Se vier com o prefixo 'qr ', remove-o para o src funcionar corretamente
          if (typeof qrSrc === 'string' && qrSrc.startsWith('qr ')) {
            qrSrc = qrSrc.replace(/^qr\s+/, '');
          }
          
          $(`#${message.sessionId} .qr`).attr('src', qrSrc).show();
          $(`#${message.sessionId} .loader`).hide();
          appendLog(message.sessionId, "» Novo QR Code gerado. Escaneie-o com seu WhatsApp.");
        }

        if (message.namespace === "ready") {
          $(`#${message.sessionId} .status-badge`).text('Pronto').css({
            'background': 'rgba(16, 185, 129, 0.2)',
            'color': '#34d399'
          });
          $(`#${message.sessionId} .qr-container`).html(`
            <div style="text-align:center; color: #34d399;">
              <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 1rem;">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
              </svg>
              <h2>Dispositivo Conectado!</h2>
              <p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.9rem;">Sessão estabelecida com sucesso.</p>
            </div>
          `);

          const link = (message.data || location.href.substring(0, location.href.length - 1)) + "/api-docs/";
          appendLog(message.sessionId, `» API Explorer: <a href="${link}" target="_blank">${link}</a>`, true);
          appendLog(message.sessionId, `» Recarregando em <span class="c" id="5"></span> segundos...`, true);
          c();
        }

        if (message.data && message.namespace !== "qr" && message.namespace !== "ready" && message.namespace !== "sessionDataBase64") {
          const logText = typeof message.data === 'object' ? JSON.stringify(message.data, null, 2) : message.data;
          appendLog(message.sessionId, `[${message.namespace}] ${logText}`);
        }
      }

      console.log("Application -> window.location.origin", window.location.origin, window.location.href);

      const socketUrl = window.location.origin;
      const fallback = `${window.location.origin}${window.location.pathname.split('/').filter(x => !x.includes('.')).join('/')}`;
      const isReverseProxied = window.location.pathname.split('/').includes('api');
      
      let socket = io(socketUrl, {
        path: isReverseProxied ? `${window.location.pathname.replace(/\/$/, '')}/socket.io` : `/socket.io`
      });

      socket.io.reconnectionAttempts(3);

      socket.io.on("reconnect_attempt", () => {
        console.log("reconnect_attempt");
      });

      socket.io.on("reconnect_failed", () => {
        console.log("reconnect_failed");
        const callbacks = [...Object.entries(socket._callbacks)];
        socket = io(fallback, {
          path: isReverseProxied ? `${window.location.pathname.replace(/\/$/, '')}/socket.io` : `/socket.io`
        });
        callbacks.map(([key, callbacks]) => callbacks.map(cb => socket.on(`${key.replace('$', '')}`, cb)));
      });

      socket.on('connect', function () {
        console.log('Connected to:', socket);
      });

      socket.on('disconnect', (reason) => {
        sessions.map(sessionId => consume({
          sessionId,
          data: `A conexão com o servidor foi encerrada. Recarregue a página se necessário.`,
          namespace: 'SOCKET'
        }));
        socket.close();
      });

      socket.on('message', consume);

      return {
        socket
      };
    };

    $(function () { var app = Application(); });
  </script>
</body>
</html>
