services:
  management-service:
    container_name: ladesa-management-service
    image: ${APP_IMAGE:-ghcr.io/ladesa-ro/management-service/management-service:development}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    ports:
      - "${HOST_PORT_API:-127.0.0.1:3000}:3000"
    volumes:
      - uploaded-data:/container/uploaded
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - API_PREFIX=${API_PREFIX:-/api/v1/}
      - STORAGE_PATH=${STORAGE_PATH:-/container/uploaded}
      - DB_CONNECTION=${DB_CONNECTION:-postgres}
      - DATABASE_URL
      - DATABASE_USE_SSL
      - OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER
      - OAUTH2_CLIENT_REGISTRATION_LOGIN_CLIENT_ID
      - OAUTH2_CLIENT_REGISTRATION_LOGIN_CLIENT_SECRET
      - OAUTH2_CLIENT_REGISTRATION_LOGIN_SCOPE
      - KC_BASE_URL
      - KC_REALM
      - KC_CLIENT_ID
      - KC_CLIENT_SECRET
      - KC_PASSWORD_RESET_REDIRECT_URI
      - MESSAGE_BROKER_URL
      - MESSAGE_BROKER_QUEUE_TIMETABLE_REQUEST
      - MESSAGE_BROKER_QUEUE_TIMETABLE_RESPONSE
      - WAHA_BASE_URL=${WAHA_HOST:-http://waha:3000}
      - WAHA_API_KEY
      - WAHA_TIMEOUT
      - WAHA_SESSION
      - WAHA_WEBHOOK_URL
    networks:
      - ladesa-net

  db:
    container_name: ladesa-management-service-db
    image: docker.io/bitnamilegacy/postgresql:15
    restart: unless-stopped
    volumes:
      - db-data:/bitnami/postgresql
    networks:
      - ladesa-net
    environment:
      POSTGRESQL_DATABASE: main
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: ladesa-rabbitmq
    image: docker.io/rabbitmq:3-management-alpine
    restart: unless-stopped
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
    networks:
      - ladesa-net
    ports:
      - "${HOST_PORT_RABBITMQ:-127.0.0.1:15672}:15672"

  waha:
    container_name: ladesa-waha-service
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT_WAHA:-127.0.0.1:3000}:3000"
    networks:
      - ladesa-net
    environment:
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-dev_key}
      - WHATSAPP_HOOK_URL=${WAHA_WEBHOOK_URL:-http://management-service:3000/api/v1/webhooks/whatsapp}
      - WHATSAPP_HOOK_EVENTS=message,session.status,state.change
      - WAHA_DASHBOARD_USERNAME=${WAHA_USERNAME:-${WAHA_USER:-ladesa}}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_PASSWORD:-changeme}
      - WHATSAPP_SWAGGER_USERNAME=${WAHA_USERNAME:-${WAHA_USER:-ladesa}}
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_PASSWORD:-changeme}
    volumes:
      - waha-session-data:/app/.sessions
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  db-data:
  uploaded-data:
  rabbitmq-data:
  waha-session-data:

networks:
  ladesa-net:
