---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ladesa-ro-timetable-worker
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd-image-updater.argoproj.io/image-list: timetable-worker=ghcr.io/ladesa-ro/management-service/timetable-worker:development
    argocd-image-updater.argoproj.io/timetable-worker.update-strategy: digest
    argocd-image-updater.argoproj.io/timetable-worker.helm.image-tag: application.deployment.image.tag
    argocd-image-updater.argoproj.io/timetable-worker.force-update: "true"
    argocd-image-updater.argoproj.io/write-back-method: argocd
spec:
  project: ladesa-satellites
  source:
    repoURL: https://github.com/ladesa-ro/management-service.git
    targetRevision: main
    path: gitops/apps/timetable-worker
    helm:
      releaseName: ladesa-ro-timetable-worker
      valueFiles:
        - values-development.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ladesa-ro-development
  revisionHistoryLimit: 3
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - FailOnSharedResource=true
      - PruneLast=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
