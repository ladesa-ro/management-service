x-podman:
  # para funcionar com o podman
  in_pod: false

services:
  management-service:
    userns_mode: keep-id:uid=1000,gid=1000 # para funcionar com o podman

    container_name: ladesa-management-service
    user: root

    build:
      context: ../src
      dockerfile: ../.docker/Containerfile
      target: devcontainer

    command:
      - sleep
      - infinity
    depends_on:
      - db
      - rabbitmq
      - waha
    networks:
      - ladesa-net
    ports:
      - "3701:3701"
      - "9229:9229"

    working_dir: /ladesa/management-service/src
    volumes:
      - ..:/ladesa/management-service:z
      - management-service-uploaded-files:/container/uploaded
      - management-service-shell-history:/container/shell-history

    environment:
      - STORAGE_PATH=/container/uploaded
    env_file:
      - ../.env

  db:
    container_name: ladesa-management-service-db
    image: docker.io/bitnamilegacy/postgresql:15
    volumes:
      - "management-service-db-data:/bitnami/postgresql"
    networks:
      - ladesa-net
    ports:
      - "5432:5432"
    environment:
      POSTGRESQL_DATABASE: main
      POSTGRESQL_PASSWORD: 7f22682363b549a389e03b7fe512488b

  rabbitmq:
    container_name: ladesa-rabbitmq
    image: docker.io/rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - ladesa-net
    ports:
      - "5672:5672"
      - "15672:15672"

  waha:
    container_name: ladesa-waha-service
    # Imagem oficial do WAHA (core, gratuita, 1 sessão).
    # Para múltiplas sessões, substituir por: devlikeapro/waha-plus
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - ladesa-net
    environment:
      # Chave de API para autenticação (header X-Api-Key)
      - WHATSAPP_API_KEY=${WAHA_API_KEY:-dev_key}
      # URL do webhook para onde o WAHA enviará eventos (message, session.status)
      - WHATSAPP_HOOK_URL=${WAHA_WEBHOOK_URL:-http://ladesa-management-service:3701/api/webhooks/whatsapp}
      # Eventos que serão enviados ao webhook
      - WHATSAPP_HOOK_EVENTS=message,session.status,state.change
      # Credenciais do dashboard/Swagger UI (basic auth)
      - WAHA_DASHBOARD_USERNAME=${WAHA_USERNAME:-${WAHA_USER:-ladesa}}
      - WAHA_DASHBOARD_PASSWORD=${WAHA_PASSWORD:-changeme}
      - WHATSAPP_SWAGGER_USERNAME=${WAHA_USERNAME:-${WAHA_USER:-ladesa}}
      - WHATSAPP_SWAGGER_PASSWORD=${WAHA_PASSWORD:-changeme}
    volumes:
      # Persistência das sessões autenticadas do WhatsApp
      - waha-session-data:/app/.sessions
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ladesa-net:

volumes:
  management-service-db-data:
  management-service-uploaded-files:
  management-service-shell-history:
  waha-session-data:
