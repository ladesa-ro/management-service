x-podman: # para funcionar com o podman
  in_pod: false

services:
  management-service:
    userns_mode: keep-id:uid=1000,gid=1000 # para funcionar com o podman

    container_name: ladesa-management-service
    user: root

    build:
      context: ../src
      dockerfile: ../.docker/Containerfile
      target: devcontainer

    command:
      - sleep
      - infinity
    depends_on:
      - db
      - rabbitmq
    networks:
      - ladesa-net
    ports:
      - "3701:3701"
      - "9229:9229"

    working_dir: /ladesa/management-service/src
    volumes:
      - ..:/ladesa/management-service:z
      - management-service-uploaded-files:/container/uploaded
      - management-service-shell-history:/container/shell-history

    environment:
      - STORAGE_PATH=/container/uploaded
    env_file:
      - ../.env

  db:
    container_name: ladesa-management-service-db
    image: docker.io/bitnamilegacy/postgresql:15
    volumes:
      - "management-service-db-data:/bitnami/postgresql"
    networks:
      - ladesa-net
    ports:
      - "5432:5432"
    environment:
      POSTGRESQL_DATABASE: main
      POSTGRESQL_PASSWORD: 7f22682363b549a389e03b7fe512488b

  rabbitmq:
    container_name: ladesa-rabbitmq
    image: docker.io/rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
    networks:
      - ladesa-net
    ports:
      - "5672:5672"
      - "15672:15672"

  openwa:
    container_name: ladesa-openwa-service
    image: openwa/wa-automate:latest
    restart: always
    ports:
      - "8000:8000"
    networks:
      - ladesa-net
    environment:
      - PORT=8000
      - API_KEY=${OPENWA_API_KEY:-dev_key}
      - WEBHOOK_URL=${OPENWA_WEBHOOK_URL:-http://management-service:3701/api/webhooks/whatsapp}
      - KEEP_ALIVE=true
    volumes:
      - openwa-session-data:/app/session
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/sessionStatus"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ladesa-net:

volumes:
  management-service-db-data:
  management-service-uploaded-files:
  management-service-shell-history:
  openwa-session-data:
